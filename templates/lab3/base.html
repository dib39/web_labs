<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Лабораторная работа №3{% endblock %}</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: #673AB7; color: white; padding: 20px; border-radius: 5px; }
        .nav { background: #f5f5f5; padding: 15px; margin: 20px 0; border-radius: 5px; }
        .nav a { margin-right: 15px; text-decoration: none; color: #673AB7; font-weight: bold; }
        .content { margin: 20px 0; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }
        .form-group { margin: 15px 0; }
        .form-control { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .btn { background: #673AB7; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #5E35B1; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Лабораторная работа №3</h1>
            <p>Построение Web-приложений с использованием представлений Django</p>
        </div>
        
        <div class="nav">
            <a href="/lab3/">Список книг</a>
            <a href="/lab3/add-reader/">Добавить читателя</a>
            <a href="/lab3/add-book/">Добавить книгу</a>
            <a href="/lab3/statistics/">Статистика</a>
            <a href="/admin/lab3/">Админка</a>
        </div>
        
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
